name: Verify Java and MySQL
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: daily_hisab_test
          MYSQL_USER: hisab_test
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :backend:test :app:lintDebug :app:assembleDebug --console=plain
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/daily_hisab_test
          TEST_DB_USER: hisab_test
          TEST_DB_PASSWORD: ci-test-only
      - uses: actions/upload-artifact@v4
        with:
          name: daily-hisab-java-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
